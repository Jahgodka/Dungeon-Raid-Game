name: C++ Build Check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install g++
      run: sudo apt-get update && sudo apt-get install -y g++

    - name: Compile the game
      run: |
        cd game
        g++ -std=c++17 *.cpp -o dungeon_raid

    - name: Verify build artifact
      run: |
        cd game
        test -f dungeon_raid && echo "Build successful!"
